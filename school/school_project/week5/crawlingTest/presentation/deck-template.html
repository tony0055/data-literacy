lute;bottom:-1.75cqw;font:400 1.15cqw ui-monospace,monospace;color:var(--muted)}
.theme-chart .bar-row{margin-bottom:1.2cqw}.theme-chart .track{height:2.5cqw}.focus-card{border-top:.25cqw solid var(--blue);padding:1.7cqw;background:#fff}.focus-card .focus-n{font:650 4cqw ui-monospace,monospace;letter-spacing:-.08em;margin:1.1cqw 0}.focus-n small{font-size:1.4cqw;color:var(--muted);letter-spacing:0}.focus-card .stack{height:2.3cqw;margin-top:1cqw}.focus-card p{font-size:1.2cqw;margin-top:1.2cqw}.source-pill{color:var(--muted);font-size:1.05cqw;line-height:1.5;margin-top:1cqw}.conclusion{font-size:4.4cqw;line-height:1.35;letter-spacing:-.035em}.outline-number{font:700 4cqw ui-monospace,monospace;color:#b8c9dd}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:3cqw}.steps strong{font-size:1.6cqw}.steps p{font-size:1.2cqw;margin-top:.5cqw}.glasses{width:34cqw;height:20cqw;position:relative;opacity:.95}.lens{position:absolute;width:14cqw;height:11cqw;border:1cqw solid #9eb8ed;top:4cqw;border-radius:3cqw 3cqw 5cqw 5cqw;background:linear-gradient(130deg,#dce9ff19,#5d89de22);box-shadow:inset 0 0 0 1px #dce9ff2c}.lens.left{left:0;transform:rotate(5deg)}.lens.right{right:0;transform:rotate(-5deg)}.bridge{position:absolute;left:13cqw;right:13cqw;height:3cqw;top:4.9cqw;border-top:.9cqw solid #9eb8ed;border-radius:50%}.camera{position:absolute;right:1cqw;top:4.1cqw;border:.28cqw solid #14273b;background:#bdd5ff;width:1.2cqw;height:1.2cqw;border-radius:50%}.diagram-label{position:absolute;bottom:0;color:#9cb1c7;font-size:.95cqw;letter-spacing:.06em}.cover{grid-template-columns:1.4fr 1fr}.cover .content{display:flex;flex-direction:column;justify-content:center}.cover .numbers{margin-top:3cqw}.cover .big{color:#fff}
.slide.active .a{animation:enter 300ms var(--ease-out) both;animation-delay:var(--delay,0ms)}.slide.active .mark,.slide.active .stack,.slide.active .vbar{animation:barReveal 650ms var(--ease-in-out) both;animation-delay:var(--delay,100ms)}.slide.active .dot{animation:enter 300ms var(--ease-out) both;animation-delay:var(--delay,0ms)}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes barReveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}.slide.active .vbar{animation-name:verticalReveal}@keyframes verticalReveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.controls{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:100;color:#d9e6f6;font-size:12px;white-space:nowrap}.controls button{border:1px solid #ffffff25;background:#ffffff08;color:inherit;border-radius:6px;padding:7px 11px;font:inherit;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 160ms ease}.controls button:active{transform:scale(.97)}button:focus-visible,a:focus-visible{outline:2px solid #9eb8ed;outline-offset:3px}.counter{font:500 12px ui-monospace,monospace;padding:0 8px}.progress{position:fixed;top:0;left:0;height:3px;background:#7da5f4;z-index:100}.help{position:fixed;right:16px;top:12px;color:#aec2da;font-size:11px}.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#14273b;color:white;padding:10px 16px;border-radius:6px;font-size:13px;z-index:150}.toast:empty{display:none}.nomotion .a,.nomotion .mark,.nomotion .stack,.nomotion .vbar,.nomotion .dot{animation:none!important;opacity:1!important;clip-path:none!important;transform:none!important}.nomotion .slide{transition:none}
@media(hover:hover) and (pointer:fine){.controls button:hover{background:#ffffff18}}@media(prefers-reduced-motion:reduce){.slide,.controls button{transition:none}.slide.active .a,.slide.active .mark,.slide.active .stack,.slide.active .vbar,.slide.active .dot{animation:none;clip-path:none;opacity:1;transform:none}}@media(max-width:600px){.help{display:none}.controls{gap:3px;font-size:10px}.controls button{padding:7px 8px}.controls .optional{display:none}.counter{font-size:10px}}@media(max-height:500px){.stage{width:min(100vw,calc((100dvh - 44px)*16/9))}.controls{bottom:3px}.controls button{padding:4px 9px}}
@media print{@page{size:320mm 180mm;margin:0}html,body{height:auto;overflow:visible;background:white}.stage{position:static;transform:none;width:320mm;height:auto;container-type:inline-size;overflow:visible;box-shadow:none}.slide{position:relative;inset:auto;width:320mm;height:180mm;visibility:visible;opacity:1;pointer-events:auto;break-after:page;transition:none}.slide:last-child{break-after:auto}.slide .a,.slide .mark,.slide .stack,.slide .vbar,.slide .dot{animation:none!important;clip-path:none!important;opacity:1!important;transform:none!important}.controls,.progress,.help,.toast{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<style>.hero{margin:0;width:37cqw;position:relative}.hero img{width:100%;border-radius:1cqw;box-shadow:0 2cqw 5cqw #0003}.hero figcaption{font-size:.9cqw;color:#a6bad0;margin-top:1cqw}.js-motion .slide.active .a,.js-motion .slide.active .mark,.js-motion .slide.active .stack,.js-motion .slide.active .vbar,.js-motion .slide.active .dot{animation:none}</style>

<body>
<div class="progress" id="progress"></div><div class="help">← → 이동 · F 전체화면 · S 발표 노트 · R 다시 재생</div>
<main class="stage" aria-label="스마트글래스 리뷰 데이터 분석 발표">{{SLIDES}}</main>
<nav class="controls" aria-label="발표 제어">
<button id="prev" aria-label="이전 슬라이드">←</button><span class="counter" id="counter" aria-live="polite"></span><button id="next" aria-label="다음 슬라이드">→</button>
<button id="replay" aria-label="현재 애니메이션 다시 재생">재생 ↻</button><button id="motion" aria-pressed="false">동작 줄이기</button>
<button id="fullscreen">전체화면 F</button><button id="notes" class="optional">발표 노트 S</button>
</nav><div id="toast" class="toast" role="status"></div>
<script type="application/json" id="reviewed-data">{{DATA}}</script>
<script>/* Anime.js v4.5.0 · MIT · assets/ANIME-LICENSE.md */
{{ANIME}}
</script>
<script>
document.body.classList.add('js-motion');
let motionRuns=[];
function playMotion(s){
  motionRuns.forEach(run=>run.revert());motionRuns=[];
  if(document.body.classList.contains('nomotion')||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const {animate,stagger}=anime;
  motionRuns.push(animate(s.querySelectorAll('.a'),{opacity:[0,1],translateY:[8,0],duration:350,delay:stagger(55),ease:'outCubic'}));
  motionRuns.push(animate(s.querySelectorAll('.mark,.stack'),{clipPath:['inset(0 100% 0 0)','inset(0 0% 0 0)'],duration:700,delay:stagger(75,{start:120}),ease:'inOutCubic'}));
  motionRuns.push(animate(s.querySelectorAll('.vbar'),{scaleY:[0.03,1],duration:700,delay:stagger(80,{start:120}),ease:'inOutCubic'}));
  motionRuns.push(animate(s.querySelectorAll('.dot'),{opacity:[0,1],translateY:[6,0],duration:300,delay:stagger(35),ease:'outCubic'}));
}
const slides = [...document.querySelectorAll('.slide')];
let current = 0;
function goTo(index) {
  if (index < 0 || index >= slides.length) return;
  slides[current].classList.remove('active');
  slides[current].inert=true;slides[current].setAttribute('aria-hidden','true');
  slides[index].classList.add('active');
  slides[index].inert=false;slides[index].setAttribute('aria-hidden','false');
  current = index;
  updateProgress();updateCounter();updateNotes();
  document.getElementById('prev').disabled=current===0;
  document.getElementById('next').disabled=current===slides.length-1;
  history.replaceState(null,'','#slide-'+(current+1));
  playMotion(slides[current]);
}
document.addEventListener('keydown', (e) => {
  if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea,[contenteditable="true"]'))return;
  if(e.target.closest('button,a')&&e.key===' ')return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(current - 1); }
  if (e.key.toLowerCase() === 'f') toggleFullscreen();
  if (e.key.toLowerCase() === 's') toggleNotes();
  if (e.key.toLowerCase() === 'r') replay();
  if(e.key==='Home')goTo(0);if(e.key==='End')goTo(slides.length-1);
});
let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend', (e) => {
  if(e.target.closest('button,a'))return;
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) diff > 0 ? goTo(current + 1) : goTo(current - 1);
},{passive:true});
function updateProgress() { document.getElementById('progress').style.width = (current / (slides.length - 1) * 100) + '%'; }
function updateCounter() { document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length; }
async function toggleFullscreen() {
  try{if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); } else { await document.exitFullscreen(); }}
  catch{document.getElementById('toast').textContent='브라우저에서 전체화면을 허용하지 않았습니다.';}
}
let notesWindow = null;
function toggleNotes() {
  if (notesWindow && !notesWindow.closed) { notesWindow.close();notesWindow = null;return; }
  notesWindow = window.open('', 'SpeakerNotes', 'width=520,height=420,top=80,left=80');
  if(!notesWindow){document.getElementById('toast').textContent='발표자 노트를 보려면 팝업을 허용해 주세요.';return;}
  notesWindow.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>발표자 노트</title><style>
  *{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#14273b;color:#e7eef7;padding:24px}.slide-num{font:12px monospace;color:#9eb8ed;margin-bottom:12px}.label{font-size:12px;color:#aec2da;margin-bottom:8px}.notes{font-size:18px;line-height:1.8;white-space:pre-wrap}.next{font-size:13px;color:#9eb8ed;margin-top:20px}</style></head><body><div class="slide-num" id="sn"></div><div class="label">발표자 노트</div><div class="notes" id="nt"></div><div class="next" id="next-title"></div></body></html>`);
  notesWindow.document.close();updateNotes();
}
function updateNotes() {
  if (!notesWindow || notesWindow.closed) return;
  const note = slides[current].dataset.notes || '(노트 없음)';
  notesWindow.document.getElementById('nt').textContent = note;
  notesWindow.document.getElementById('sn').textContent = 'Slide ' + (current + 1) + ' / ' + slides.length;
  notesWindow.document.getElementById('next-title').textContent='다음: '+([...slides[current+1]?.querySelectorAll('h1,h2')||[]].find(el=>el.textContent.trim())?.textContent||'발표 종료');
}
function replay(){playMotion(slides[current]);}
document.getElementById('prev').onclick=()=>goTo(current-1);document.getElementById('next').onclick=()=>goTo(current+1);
document.getElementById('fullscreen').onclick=toggleFullscreen;document.getElementById('notes').onclick=toggleNotes;document.getElementById('replay').onclick=replay;
document.getElementById('motion').onclick=event=>{const reduced=document.body.classList.toggle('nomotion');event.currentTarget.setAttribute('aria-pressed',String(reduced));event.currentTarget.textContent=reduced?'동작 켜기':'동작 줄이기';playMotion(slides[current]);};
slides.forEach(s=>{s.inert=true;s.setAttribute('aria-hidden','true');});
const requested=Number(location.hash.replace('#slide-',''))-1;goTo(Number.isInteger(requested)&&requested>=0&&requested<slides.length?requested:0);
</script>
</body></html>
